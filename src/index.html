<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Udonarium Axe</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f3eef8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f2a38" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Udonarium Axe" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- テーマフラッシュ防止: Angular起動前に data-theme を適用 -->
    <script>
      (function () {
        var t = localStorage.getItem('ui-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>

  <body>
    <app-root>
      <div class="sk-cube-grid">
        <div class="sk-cube sk-cube1"></div>
        <div class="sk-cube sk-cube2"></div>
        <div class="sk-cube sk-cube3"></div>
        <div class="sk-cube sk-cube4"></div>
        <div class="sk-cube sk-cube5"></div>
        <div class="sk-cube sk-cube6"></div>
        <div class="sk-cube sk-cube7"></div>
        <div class="sk-cube sk-cube8"></div>
        <div class="sk-cube sk-cube9"></div>
        <div class="sk-title">Now Loading.</div>
      </div>
    </app-root>

    <script type="text/javascript" src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
