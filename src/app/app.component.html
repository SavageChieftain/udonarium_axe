<div id="app-table-layer" class="absolute w-full h-full overflow-hidden">
  <game-table></game-table>
</div>
<app-mini-jukebox></app-mini-jukebox>
<div class="fab-nav" [class.open]="fabOpen()">
  <nav class="fab-panel">
    <ul>
      <li data-label="接続" (click)="open('PeerMenuComponent')">
        <i class="material-icons">people</i>
      </li>
      <li data-label="チャット" (click)="open('ChatWindowComponent')">
        <i class="material-icons">speaker_notes</i>
      </li>
      <li data-label="テーブル設定" (click)="open('GameTableSettingComponent')">
        <i class="material-icons">layers</i>
      </li>
      <li data-label="画像" (click)="open('FileStorageComponent')">
        <i class="material-icons">photo_library</i>
      </li>
      <li data-label="ジュークボックス" (click)="open('JukeboxComponent')">
        <i class="material-icons">queue_music</i>
      </li>
      <li data-label="カットイン" (click)="open('CutInListComponent')">
        <i class="material-icons">slideshow</i>
      </li>
      <li data-label="インベントリ" (click)="open('GameObjectInventoryComponent')">
        <i class="material-icons">folder_shared</i>
      </li>
      <li data-label="ZIP読込">
        <label>
          <i class="material-icons">open_in_browser</i>
          <input
            type="file"
            class="hidden"
            (change)="handleFileSelect($event)"
            multiple
            accept="application/xml,text/xml,application/zip"
          />
        </label>
      </li>
    </ul>
    <div class="fab-footer">
      @if (!isSaving()) {
        <div class="fab-footer-item" data-label="保存" (click)="save()">
          <i class="material-icons">sd_storage</i>
        </div>
      }
      @if (isSaving()) {
        <div
          class="fab-footer-item"
          [attr.data-label]="progressPercent() + '%'"
          style="pointer-events: none; opacity: 0.6"
        >
          <i class="material-icons vibration-amine">sd_storage</i>
        </div>
      }
      <div class="fab-footer-item" [attr.data-label]="themeLabel()" (click)="theme.cycle()">
        @switch (theme.theme()) {
          @case ('auto') {
            <i class="material-icons">brightness_auto</i>
          }
          @case ('dark') {
            <i class="material-icons">dark_mode</i>
          }
          @case ('light') {
            <i class="material-icons">light_mode</i>
          }
        }
      </div>
    </div>
  </nav>
  <button
    class="fab-btn"
    (click)="fabOpen.set(!fabOpen())"
    [attr.aria-label]="fabOpen() ? 'メニューを閉じる' : 'メニューを開く'"
    [attr.aria-expanded]="fabOpen()"
  >
    <i class="material-icons">{{ fabOpen() ? 'close' : 'menu' }}</i>
  </button>
</div>
<div #modalLayer></div>
<network-indicator class="networkIndicator"></network-indicator>
