<!--<h2>チャットシステム</h2>-->
<div class="component">
  <div class="log">
    @if (chatTab) {
      <chat-tab [chatTab]="chatTab" (addMessage)="scrollToBottom()"></chat-tab>
    }
    @if (!chatTab) {
      <div>
        ※チャットタブの内容が更新されました。チャットタブを選択しなおすか、このチャットウィンドウを開きなおしてください。
      </div>
    }
  </div>
  <div class="sticky-bottom">
    <form>
      <!--  -->

      <chat-tachie [chatTabidentifier]="chatTabidentifier"></chat-tachie>
      <!-- entyu end -->
      <div class="chat-tab">
        @for (chatTab of chatMessageService.chatTabs; track trackByChatTab($index, chatTab)) {
          <label>
            <input
              name="chat-tab"
              type="radio"
              value="{{ chatTab.identifier }}"
              ng-control="options"
              [(ngModel)]="chatTabidentifier"
            />
            <div>
              {{ chatTab.name }}
              @if (chatTab.hasUnread) {
                <badge class="badge" [count]="chatTab.unreadLength"></badge>
              }
            </div>
          </label>
        }
        <button class="tab-setting small-font" (click)="showTabSetting()">
          <i class="material-icons small-font">settings</i>タブ設定
        </button>
        <button class="tab-setting small-font" (click)="showDiceTableSetting()">
          <i class="material-icons small-font">settings</i>ダイス表設定
        </button>
        <button class="tab-setting small-font" (click)="showVoteMenu()">
          <i class="material-icons small-font">group</i>点呼
        </button>
        <button class="tab-setting small-font" (click)="showAlarmMenu()">
          <i class="material-icons small-font">alarm</i>
        </button>
      </div>
    </form>
    <chat-input
      [chatTabidentifier]="chatTabidentifier"
      [(gameType)]="gameType"
      [(sendFrom)]="sendFrom"
      (chat)="sendChat($event)"
      (tabSwitch)="chatTabSwitchRelative($event)"
    ></chat-input>
  </div>

  <!--<div style="white-space:pre-wrap; font-size: 8px;"><span>{{gameHelp}}</span></div>-->
</div>
