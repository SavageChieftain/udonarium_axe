<div
  class="draggable-panel animate-fly-in rounded-ui-lg border-ui-border-panel bg-ui-panel text-ui-text absolute top-50 box-border h-50 max-h-full w-75 max-w-full overflow-visible border border-solid p-0 shadow-[var(--ui-shadow-md),inset_0_1px_0_rgba(255,255,255,0.06)] [backdrop-filter:blur(24px)_saturate(1.5)] [-webkit-backdrop-filter:blur(24px)_saturate(1.5)]"
  [ngClass]="{ 'pointer-events-none': isPointerDragging }"
  [class.bg-transparent!]="contentMinimized"
  [class.border-transparent!]="contentMinimized"
  [class.shadow-none!]="contentMinimized"
  [style.backdrop-filter]="contentMinimized ? 'none' : null"
  [style.-webkit-backdrop-filter]="contentMinimized ? 'none' : null"
  [style.left.px]="left"
  [style.top.px]="top"
  [style.width.px]="width"
  [style.height]="contentMinimized ? 'auto' : height + 'px'"
  [style.zIndex]="isFullScreen() ? '201' : null"
  [style.visibility]="panelService.invisible ? 'hidden' : ''"
  [style.pointer-events]="panelService.invisible ? 'none' : ''"
  [resizable.disable]="isMinimized() || isFullScreen()"
  [resizable.minWidth]="minWidth"
  [resizable.minHeight]="minHeight"
  [draggable.stack]="'.draggable-panel'"
  appDraggable
  appResizable
  #draggablePanel
  (mouseenter)="showPortrait(true)"
  (mouseleave)="showPortrait(false)"
>
  <div
    class="rounded-t-ui-lg border-ui-border-titlebar bg-ui-titlebar text-ui-muted relative box-border h-7 w-full border-b border-solid px-2 text-xs/7 font-medium tracking-[0.02em] select-none"
    #titleBar
    [class.border-transparent!]="contentMinimized"
    [style.background]="contentMinimized ? 'color-mix(in srgb, var(--color-ui-titlebar) 55%, transparent)' : null"
    [style.backdrop-filter]="contentMinimized ? 'blur(8px)' : null"
    [style.-webkit-backdrop-filter]="contentMinimized ? 'blur(8px)' : null"
    [style.display]="showTitle() ? '' : 'none'"
  >
    @if (title !== menuTitle) {
      <div class="absolute top-0 right-0 flex h-7 items-center gap-0.5 px-1.5">
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5.5 transform-none items-center justify-center border-none bg-transparent px-1 py-0.5 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          [disabled]="isFullScreen()"
          (click)="toggleMinimize()"
        >
          <i class="material-icons text-[14px]!">remove</i>
        </button>
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5.5 transform-none items-center justify-center border-none bg-transparent px-1 py-0.5 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          [disabled]="isMinimized()"
          (click)="toggleFullScreen()"
        >
          <i class="material-icons text-[14px]!">fullscreen</i>
        </button>
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-5.5 transform-none items-center justify-center border-none bg-transparent px-1 py-0.5 leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          (click)="close()"
        >
          <i class="material-icons text-[14px]!">close</i>
        </button>
      </div>
    }
    <div
      class="block truncate pr-21.5"
      [class.invisible]="contentMinimized"
      [appTextTooltip]="panelService.titleTooltip"
    >
      {{ panelService.title }}
    </div>
  </div>
  @if (panelService.chatTab && chatPortraitComponent) {
    <ng-container
      *ngComponentOutlet="
        chatPortraitComponent;
        inputs: {
          chatTabidentifier: panelService.chatTab.identifier,
          isTilteTop: true,
          dispByMouse: portraitDispByMouse(),
        }
      "
    ></ng-container>
  }
  @if (panelService.cardStack && cardStackListComponent) {
    <ng-container
      *ngComponentOutlet="cardStackListComponent; inputs: { cardStackidentifier: panelService.cardStack.identifier }"
    ></ng-container>
  }
  <div
    class="rounded-b-ui-lg absolute bottom-0 box-border w-full overflow-auto overscroll-contain"
    [class.static!]="contentMinimized"
    [ngStyle]="{
      padding: padding_,
      top: showTitle() ? '28px' : '0',
      overflow: overflowVisible() || contentMinimized ? 'visible' : undefined,
    }"
    #scrollablePanel
  >
    <ng-content></ng-content>
    <div #content></div>
  </div>
</div>
