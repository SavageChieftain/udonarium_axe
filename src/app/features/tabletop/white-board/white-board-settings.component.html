<div class="flex flex-col gap-3 p-3">
  <div>
    <label class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase" for="board-name">
      {{ 'feature.whiteBoard.settings.name' | transloco }}
    </label>
    <input
      class="border-ui-border-panel bg-ui-input text-ui-text focus:border-ui-accent rounded-ui-sm box-border w-full border border-solid px-2.5 py-1.5 text-[0.9rem] outline-none"
      id="board-name"
      name="board-name"
      [(ngModel)]="name"
    />
  </div>

  <div class="flex gap-2">
    <div class="flex-1">
      <label
        class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase"
        for="board-width"
      >
        {{ 'feature.whiteBoard.settings.width' | transloco }}
      </label>
      <input
        class="border-ui-border-panel bg-ui-input text-ui-text focus:border-ui-accent rounded-ui-sm box-border w-full border border-solid px-2 py-1.5 text-center text-[13px] outline-none"
        id="board-width"
        name="board-width"
        type="number"
        [min]="minSide"
        [max]="maxSide"
        [(ngModel)]="width"
      />
    </div>
    <div class="flex-1">
      <label
        class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase"
        for="board-height"
      >
        {{ 'feature.whiteBoard.settings.height' | transloco }}
      </label>
      <input
        class="border-ui-border-panel bg-ui-input text-ui-text focus:border-ui-accent rounded-ui-sm box-border w-full border border-solid px-2 py-1.5 text-center text-[13px] outline-none"
        id="board-height"
        name="board-height"
        type="number"
        [min]="minSide"
        [max]="maxSide"
        [(ngModel)]="height"
      />
    </div>
  </div>

  <div>
    <label class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase" for="board-pitch">
      {{ 'feature.whiteBoard.settings.pitch' | transloco }} ({{ pitch }}°)
    </label>
    <input
      class="w-full"
      id="board-pitch"
      name="board-pitch"
      type="range"
      [min]="minPitch"
      [max]="maxPitch"
      step="5"
      [(ngModel)]="pitch"
    />
  </div>

  <div>
    <label class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase" for="board-rotate">
      {{ 'feature.whiteBoard.settings.rotate' | transloco }} ({{ rotate }}°)
    </label>
    <input
      class="w-full"
      id="board-rotate"
      name="board-rotate"
      type="range"
      min="0"
      max="359"
      step="1"
      [(ngModel)]="rotate"
    />
  </div>

  <div>
    <label
      class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase"
      for="board-opacity"
    >
      {{ 'feature.whiteBoard.settings.opacity' | transloco }} ({{ opacityPercent }}%)
    </label>
    <input
      class="w-full"
      id="board-opacity"
      name="board-opacity"
      type="range"
      min="0"
      max="100"
      step="5"
      [(ngModel)]="opacityPercent"
    />
  </div>

  <div>
    <label class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase" for="board-color">
      {{ 'feature.whiteBoard.settings.color' | transloco }}
    </label>
    <input class="h-8 w-full" id="board-color" name="board-color" type="color" [(ngModel)]="color" />
  </div>

  <div>
    <label class="text-ui-muted mb-1 block text-[0.78rem] font-semibold tracking-[0.04em] uppercase">
      {{ 'feature.whiteBoard.settings.image' | transloco }}
    </label>
    <div class="flex items-center gap-2">
      <div
        class="border-ui-border-panel rounded-ui-sm size-12 shrink-0 border border-solid bg-contain bg-center bg-no-repeat"
        [style.background-image]="imageUrl.length > 0 ? 'url(' + imageUrl + ')' : null"
      ></div>
      <button
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text cursor-pointer border border-solid px-2 py-1.5 text-[0.82rem]"
        type="button"
        (click)="chooseImage()"
      >
        {{ 'feature.whiteBoard.settings.imageChoose' | transloco }}
      </button>
      @if (imageUrl.length > 0) {
        <button
          class="text-ui-accent cursor-pointer border-0 bg-transparent p-0 text-[0.8rem]"
          type="button"
          (click)="clearImage()"
        >
          {{ 'feature.whiteBoard.settings.imageClear' | transloco }}
        </button>
      }
    </div>
  </div>

  <div class="flex flex-col gap-1.5 text-[0.85rem]">
    <label class="flex cursor-pointer items-center gap-2">
      <input type="checkbox" name="board-shadow" [(ngModel)]="isDropShadow" />
      {{ 'feature.whiteBoard.settings.dropShadow' | transloco }}
    </label>
    <label class="flex cursor-pointer items-center gap-2">
      <input type="checkbox" name="board-lock" [(ngModel)]="isLock" />
      {{ 'feature.whiteBoard.settings.lock' | transloco }}
    </label>
  </div>

  <div>
    <div class="mb-1 flex items-baseline justify-between">
      <label class="text-ui-muted text-[0.78rem] font-semibold tracking-[0.04em] uppercase">
        {{ 'feature.whiteBoard.settings.contents' | transloco: { count: standing.length } }}
      </label>
      <div class="flex gap-2">
        <button
          class="text-ui-accent cursor-pointer border-0 bg-transparent p-0 text-[0.78rem]"
          type="button"
          (click)="gather()"
        >
          {{ 'feature.whiteBoard.settings.gather' | transloco }}
        </button>
        @if (standing.length > 0) {
          <button
            class="text-ui-accent cursor-pointer border-0 bg-transparent p-0 text-[0.78rem]"
            type="button"
            (click)="clearBoard()"
          >
            {{ 'feature.whiteBoard.settings.clear' | transloco }}
          </button>
        }
      </div>
    </div>

    @if (standing.length === 0) {
      <div class="text-ui-dim text-[0.8rem]">{{ 'feature.whiteBoard.settings.contentsEmpty' | transloco }}</div>
    } @else {
      <div class="border-ui-border-panel rounded-ui-sm flex max-h-40 flex-col overflow-y-auto border border-solid">
        @for (object of standing; track object.identifier) {
          <div class="flex items-center justify-between gap-2 px-2 py-1 text-[0.82rem]">
            <span class="truncate">{{ nameOf(object) }}</span>
            <button
              class="text-ui-accent shrink-0 cursor-pointer border-0 bg-transparent p-0 text-[0.78rem]"
              type="button"
              (click)="takeOff(object)"
            >
              {{ 'feature.whiteBoard.settings.takeOff' | transloco }}
            </button>
          </div>
        }
      </div>
    }
  </div>
</div>
