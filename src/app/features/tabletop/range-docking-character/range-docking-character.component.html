<div class="table">
  <div class="table-cell" style="width: 7em">
    <div style="text-align: center">接続先＞</div>
  </div>
  <div class="table-cell">
    <ng-select
      name="send-from"
      class="ud-select"
      style="width: 12em"
      [ngModel]="sendFrom()"
      (ngModelChange)="sendFrom.set($event)"
      [clearable]="false"
    >
      @for (gameCharacter of gameCharacters(); track gameCharacter.identifier) {
        <ng-option [value]="gameCharacter.identifier">{{ gameCharacter.name }} </ng-option>
      }
    </ng-select>
  </div>
</div>
<div class="table">
  <div class="table-cell imagebox">
    @if (imageFile().url) {
      <img class="image" [src]="imageFile().url | safe: 'resourceUrl'" />
    }
  </div>
</div>
<br />
<div class="table">
  <button (click)="followring()" style="width: 9em">接続実行</button>
  <button (click)="cancel()" style="width: 9em; margin-left: 3em">キャンセル</button>
</div>
