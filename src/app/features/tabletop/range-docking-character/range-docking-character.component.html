<div class="box-border p-[5px] table w-full">
  <div class="table-cell w-[7em]">
    <div class="text-center">接続先＞</div>
  </div>
  <div class="table-cell">
    <ng-select
      name="send-from"
      class="ud-select w-[12em]"
      [ngModel]="sendFrom()"
      (ngModelChange)="sendFrom.set($event)"
      [clearable]="false"
    >
      @for (gameCharacter of gameCharacters(); track gameCharacter.identifier) {
        <ng-option [value]="gameCharacter.identifier">{{ gameCharacter.name }} </ng-option>
      }
    </ng-select>
  </div>
</div>
<div class="box-border p-[5px] table w-full">
  <div class="table-cell align-top text-center w-[50px]">
    @if (imageFile().url) {
      <img class="w-[50px] h-[50px] object-cover" [src]="imageFile().url | safe: 'resourceUrl'" />
    }
  </div>
</div>
<br />
<div class="box-border p-[5px] table w-full">
  <button (click)="followring()" class="w-[9em]">接続実行</button>
  <button (click)="cancel()" class="w-[9em] ml-[3em]">キャンセル</button>
</div>
