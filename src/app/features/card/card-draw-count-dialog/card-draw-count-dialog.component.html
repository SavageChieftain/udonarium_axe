<form class="box-border flex w-[220px] max-w-full flex-col gap-3 p-2" (ngSubmit)="confirm()">
  <label class="text-ui-muted grid grid-cols-[4em_minmax(0,1fr)] items-center gap-2 text-[12px]">
    <span>枚数</span>
    <input
      class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text box-border w-full min-w-0 border border-solid px-2 py-[5px] text-[13px]"
      name="draw-count"
      type="number"
      min="1"
      [max]="maxCount"
      step="1"
      [(ngModel)]="count"
      [disabled]="maxCount < 1"
      autofocus
    />
  </label>

  <div class="flex justify-end gap-2">
    <button class="px-[10px] py-[5px] text-[12px]" type="button" (click)="cancel()">キャンセル</button>
    <button
      class="border-ui-accent bg-ui-accent px-[10px] py-[5px] text-[12px] text-white"
      type="submit"
      [disabled]="maxCount < 1"
    >
      引く
    </button>
  </div>
</form>
