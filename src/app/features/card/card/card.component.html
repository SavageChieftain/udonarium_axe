<div
  class="component is-3d is-pointer-events-none is-grab"
  [style.width.px]="size * gridSize"
  appMovable
  [movable.option]="movableOption()"
  [movable.disable]="isLock"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
>
  <div
    class="component-content is-pointer-events-auto is-3d"
    appRotable
    [rotable.option]="rotableOption()"
    (rotable.ondragstart)="onMove()"
    (rotable.ondragend)="onMoved()"
  >
    @if (imageFile()) {
      <img
        class="card-image is-3d chrome-smooth-image-trick"
        [src]="(isFront ? frontImage.url : backImage.url) | safe: 'resourceUrl'"
      />
    }
    @if (!isFront && hasOwner && 0 < ownerName.length) {
      <div
        class="name-tag is-nowrap has-length-limit is-black-background will-change"
        [ngStyle]="{ transform: 'translateY(-75%) translateX(-50%) translateX(' + (size * gridSize) / 2 + 'px)' }"
      >
        <span class="is-3d">{{ ownerName }}</span>
      </div>
    }
    @if (isHand && frontImage) {
      <img
        class="card-image thumbnail-transform is-translucent is-3d will-change chrome-smooth-image-trick"
        [src]="frontImage.url | safe: 'resourceUrl'"
      />
    }
    @if (!isIconHidden() && !isLock) {
      <div class="rotate-grab of-left-top is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="rotate-grab of-left-bottom is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="rotate-grab of-right-bottom is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="rotate-grab of-right-top is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="border-bg is-pointer-events-none is-3d will-change"></div>
    }
    @if (isLock && dispLockMark) {
      <div
        class="lock-icon-mark is-nowrap is-black-background is-3d will-change"
        [ngStyle]="{ transform: 'translateY(0%) translateX(-50%) translateX(' + (size * gridSize) / 2 + 'px)' }"
      >
        <i class="material-icons inline">lock</i>
      </div>
    }
  </div>
</div>
