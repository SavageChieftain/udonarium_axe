<div
  class="component is-3d is-pointer-events-none"
  [ngClass]="{ 'is-empty': isEmpty }"
  [style.width.px]="size * gridSize"
  appMovable
  [movable.option]="movableOption()"
  (movable.ondragstart)="onMove()"
  (movable.ondragend)="onMoved()"
>
  <div
    class="component-content is-pointer-events-auto is-grab"
    appRotable
    [rotable.option]="rotableOption()"
    (rotable.ondragstart)="onMove()"
    (rotable.ondragend)="onMoved()"
  >
    @if (topCard && imageFile()) {
      <div [class.shuffling]="animeState() === 'active'" (animationend)="onShuffleDone()">
        <img
          class="card-image chrome-smooth-image-trick"
          [ngStyle]="{ transform: 'rotateZ(' + topCard.rotate + 'deg)' }"
          [src]="imageFile().url | safe: 'resourceUrl'"
        />
      </div>
    }
    @if (!isIconHidden() && !isLock) {
      <div class="rotate-grab of-left-top is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="rotate-grab of-left-bottom is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="rotate-grab of-right-bottom is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
      <div class="rotate-grab of-right-top is-3d will-change">
        <i class="material-icons">autorenew</i>
      </div>
    }
    @if (isLock) {
      <div
        class="lock-icon-mark is-nowrap is-black-background is-3d will-change"
        [ngStyle]="{ transform: 'translateY(0%) translateX(-50%) translateX(' + (size * gridSize) / 2 + 'px)' }"
      >
        <i class="material-icons" style="display: inline">lock</i>
      </div>
    }
    @if (isShowTotal) {
      <div
        class="name-tag is-nowrap is-black-background is-3d will-change"
        [ngStyle]="{ transform: 'translateY(-50%) translateX(-50%) translateX(' + (size * gridSize) / 2 + 'px)' }"
      >
        <span>{{ cards.length }}枚</span>
      </div>
    }
    @if (hasOwner) {
      <div
        class="name-tag has-length-limit is-nowrap is-black-background is-3d will-change"
        [ngStyle]="{ transform: 'translateY(50%) translateX(-50%) translateX(' + (size * gridSize) / 2 + 'px)' }"
      >
        <span>{{ ownerName }} が確認中</span>
      </div>
    }
  </div>
</div>
