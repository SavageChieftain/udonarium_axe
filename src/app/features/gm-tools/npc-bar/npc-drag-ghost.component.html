@if (drag.character(); as ghost) {
  <div
    class="border-ui-accent bg-ui-panel shadow-ui-md pointer-events-none fixed z-10000 flex size-11 items-center justify-center overflow-hidden rounded-md border-2 border-solid p-0.5 opacity-90"
    [style.left.px]="drag.x() + 12"
    [style.top.px]="drag.y() + 12"
  >
    @if (imageUrl()) {
      <img class="size-full rounded-sm object-contain" [src]="imageUrl() | safe: 'resourceUrl'" alt="" />
    } @else {
      <i class="material-icons text-ui-muted text-[22px]!">person</i>
    }
  </div>
}
