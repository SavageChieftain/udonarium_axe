@if (isPlayer()) {
  <div
    #bar
    class="pl-toolbar rounded-ui-lg border-ui-border-panel bg-ui-panel text-ui-text shadow-ui-md fixed top-0 left-0 z-150 flex cursor-grab items-center gap-1 border border-solid px-2 py-1.5 [backdrop-filter:blur(24px)_saturate(1.5)] select-none [-webkit-backdrop-filter:blur(24px)_saturate(1.5)] active:cursor-grabbing"
    appDraggable
    [draggable.unhandle]="'button'"
  >
    <span class="text-ui-muted flex cursor-grab items-center gap-1 px-1 text-[11px] font-semibold tracking-wide">
      <i class="material-icons text-[16px]!">person</i>
      {{ 'app.fab.plTools' | transloco }}
    </span>

    <button
      type="button"
      class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 cursor-pointer items-center justify-center border-none bg-transparent transition-colors [&_i]:text-[20px]!"
      [title]="'app.fab.ownedCharacters' | transloco"
      (click)="openOwnedCharacterList()"
    >
      <i class="material-icons">groups</i>
    </button>
  </div>
}
