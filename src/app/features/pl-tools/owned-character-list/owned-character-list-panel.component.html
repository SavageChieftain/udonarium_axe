<div class="bg-ui-panel text-ui-text flex h-full flex-col overflow-y-auto p-2">
  @for (character of characters(); track character.identifier) {
    <div
      class="rounded-ui-sm border-ui-border-panel hover:bg-ui-menu-hover mb-1 flex items-center gap-2 border border-solid p-1.5"
    >
      <div class="bg-ui-elevated size-10 shrink-0 overflow-hidden rounded-sm">
        @if (imageUrl(character)) {
          <img class="size-full object-contain" [src]="imageUrl(character) | safe: 'resourceUrl'" alt="" />
        }
      </div>

      <span class="min-w-0 flex-1 truncate text-[13px]">{{ displayName(character) }}</span>

      <button
        type="button"
        class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 cursor-pointer items-center justify-center border-none bg-transparent transition-colors [&_i]:text-[18px]!"
        [title]="'feature.plTools.ownedCharacters.chatPalette' | transloco"
        (click)="openChatPalette(character)"
      >
        <i class="material-icons">chat</i>
      </button>

      <button
        type="button"
        class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 cursor-pointer items-center justify-center border-none bg-transparent transition-colors [&_i]:text-[18px]!"
        [title]="'feature.plTools.ownedCharacters.sheet' | transloco"
        (click)="openSheet(character)"
      >
        <i class="material-icons">badge</i>
      </button>

      <button
        type="button"
        class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 items-center justify-center border-none bg-transparent transition-colors disabled:cursor-default disabled:opacity-35 [&_i]:text-[18px]!"
        [class.cursor-pointer]="canFocus(character)"
        [disabled]="!canFocus(character)"
        [title]="
          (canFocus(character) ? 'feature.plTools.ownedCharacters.focus' : 'feature.plTools.ownedCharacters.notOnTable')
            | transloco
        "
        (click)="focusToKoma(character)"
      >
        <i class="material-icons">my_location</i>
      </button>
    </div>
  } @empty {
    <p class="text-ui-dim m-0 p-3 text-center text-[12px]">
      {{ 'feature.plTools.ownedCharacters.empty' | transloco }}
    </p>
  }
</div>
