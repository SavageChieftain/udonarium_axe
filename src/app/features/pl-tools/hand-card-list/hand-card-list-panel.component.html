<div class="bg-ui-panel text-ui-text flex h-full flex-col overflow-y-auto p-2">
  @for (card of cards(); track card.identifier) {
    <div
      class="rounded-ui-sm border-ui-border-panel hover:bg-ui-menu-hover mb-1 flex items-center gap-2 border border-solid p-1.5"
    >
      <div class="bg-ui-elevated h-14 w-10 shrink-0 overflow-hidden rounded-sm">
        @if (imageUrl(card)) {
          <img class="size-full object-contain" [src]="imageUrl(card) | safe: 'resourceUrl'" alt="" />
        }
      </div>

      <span class="min-w-0 flex-1 truncate text-[13px]">{{ displayName(card) }}</span>

      <button
        type="button"
        class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 cursor-pointer items-center justify-center border-none bg-transparent transition-colors [&_i]:text-[18px]!"
        [title]="'feature.plTools.hand.faceUp' | transloco"
        (click)="faceUp(card)"
      >
        <i class="material-icons">visibility</i>
      </button>

      <button
        type="button"
        class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 cursor-pointer items-center justify-center border-none bg-transparent transition-colors [&_i]:text-[18px]!"
        [title]="'feature.plTools.hand.faceDown' | transloco"
        (click)="faceDown(card)"
      >
        <i class="material-icons">visibility_off</i>
      </button>

      <button
        type="button"
        class="rounded-ui-sm text-ui-text hover:bg-ui-menu-hover hover:text-ui-accent flex size-8 items-center justify-center border-none bg-transparent transition-colors disabled:cursor-default disabled:opacity-35 [&_i]:text-[18px]!"
        [class.cursor-pointer]="canFocus(card)"
        [disabled]="!canFocus(card)"
        [title]="(canFocus(card) ? 'feature.plTools.hand.focus' : 'feature.plTools.hand.notOnTable') | transloco"
        (click)="focusToCard(card)"
      >
        <i class="material-icons">my_location</i>
      </button>
    </div>
  } @empty {
    <p class="text-ui-dim m-0 p-3 text-center text-[12px]">
      {{ 'feature.plTools.hand.empty' | transloco }}
    </p>
  }
</div>
