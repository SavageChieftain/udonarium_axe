@if (character()) {
  <div class="box-border flex h-full flex-col px-2 pt-1 pb-2">
    @if (character()!.buffDataElement) {
      <div class="mb-2 min-h-0 flex-1 overflow-y-auto">
        @for (childElement of buffChildren(); track childElement.identifier) {
          <div game-data-element-buff [gameDataElement]="childElement" [isEdit]="isEdit()" [isPieceMode]="false"></div>
        }
        @if (buffChildren().length === 0) {
          <p class="text-ui-dim m-0 py-3 text-center text-[0.85em]">
            {{ 'feature.character.buff.empty' | transloco }}
          </p>
        }
      </div>
    }
    <div class="border-ui-border-panel flex flex-none justify-end border-t border-solid pt-1.5">
      <button
        class="rounded-ui-sm border-ui-border-panel bg-ui-elevated text-ui-muted hover:border-ui-accent hover:bg-ui-accent-bg hover:text-ui-accent inline-flex cursor-pointer items-center gap-0.75 border border-solid px-2.5 py-1 text-[0.8em] transition-colors [&_i]:text-[0.9rem]"
        (click)="addBuff()"
      >
        <i class="material-icons">add</i>
        {{ 'feature.character.buff.add' | transloco }}
      </button>
    </div>
  </div>
}
