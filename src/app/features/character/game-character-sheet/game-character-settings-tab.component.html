<div class="grid grid-cols-2 gap-2 px-2.5 pt-2.5 pb-3.5">
  <!-- インベントリ設定 -->
  <div class="bg-ui-elevated border-ui-border-panel flex flex-col gap-1.5 rounded-sm border border-solid px-3 py-2.5">
    <div
      class="border-ui-border-panel text-ui-accent mt-0 mb-2 flex items-center gap-1.25 border-b border-solid pb-1.25 text-[0.72em] font-semibold tracking-[0.06em] uppercase [&_.material-icons]:text-[14px]!"
    >
      <i class="material-icons">inventory_2</i>インベントリ設定
    </div>
    <select
      class="bg-ui-input text-ui-text border-ui-border-input rounded-ui-sm cursor-pointer border border-solid px-1.5 py-0.75 text-[0.82em]"
      (change)="onSetLocation($event)"
      name="location"
      [ngModel]="character().location.name"
      title="配置場所"
    >
      <option value="table">テーブル</option>
      <option value="common">共有インベントリ</option>
      <option value="{{ myPeerId }}">個人インベントリ</option>
      <option value="graveyard">墓地</option>
    </select>
    <div class="flex flex-wrap items-center gap-2">
      <label
        class="text-ui-muted inline-flex cursor-pointer items-center gap-1.25 text-[0.82em] select-none [&_input[type=checkbox]]:cursor-pointer [&_input[type=checkbox]]:[accent-color:var(--ui-accent)]"
      >
        <input type="checkbox" [(ngModel)]="character().hideInventory" />非表示
      </label>
      <label
        class="text-ui-muted inline-flex cursor-pointer items-center gap-1.25 text-[0.82em] select-none [&_input[type=checkbox]]:cursor-pointer [&_input[type=checkbox]]:[accent-color:var(--ui-accent)]"
      >
        <input type="checkbox" [(ngModel)]="character().nonTalkFlag" />発言しない
      </label>
    </div>
  </div>

  <!-- コマ設定 -->
  <div class="bg-ui-elevated border-ui-border-panel flex flex-col gap-1.5 rounded-sm border border-solid px-3 py-2.5">
    <div
      class="border-ui-border-panel text-ui-accent mt-0 mb-2 flex items-center gap-1.25 border-b border-solid pb-1.25 text-[0.72em] font-semibold tracking-[0.06em] uppercase [&_.material-icons]:text-[14px]!"
    >
      <i class="material-icons">person_pin</i>コマ設定
    </div>
    <label
      class="text-ui-muted inline-flex cursor-pointer items-center gap-1.25 text-[0.82em] select-none [&_input[type=checkbox]]:cursor-pointer [&_input[type=checkbox]]:[accent-color:var(--ui-accent)]"
    >
      <input
        type="checkbox"
        [ngModel]="character().specifyKomaImageFlag"
        (ngModelChange)="setSpecifyKomaImageFlag($event)"
      />コマ高さを指定
    </label>
    <div
      class="flex items-center gap-1.5 text-[0.82em] [&_input[type=range]]:min-w-0 [&_input[type=range]]:flex-[1_1_0]"
      [class.opacity-40]="!character().specifyKomaImageFlag"
      [class.pointer-events-none]="!character().specifyKomaImageFlag"
    >
      <input
        type="range"
        min="50"
        max="750"
        [(ngModel)]="character().komaImageHeight"
        [disabled]="!character().specifyKomaImageFlag"
        (input)="onChkKomaSize($event)"
        (change)="onChkKomaSize($event)"
      />
      <input
        class="bg-ui-input border-ui-border-input text-ui-text rounded-ui-sm w-[4.5em] border border-solid px-1.25 py-0.5 text-right text-[0.82em]"
        type="number"
        min="50"
        max="750"
        [(ngModel)]="character().komaImageHeight"
        [disabled]="!character().specifyKomaImageFlag"
        (change)="onChkKomaSize($event)"
      />
      <span class="text-ui-muted shrink-0 text-[0.78em] whitespace-nowrap">px</span>
    </div>
    <div class="flex items-center gap-1.5 text-[0.82em]">
      <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap">高度</span>
      <input
        class="bg-ui-input border-ui-border-input text-ui-text rounded-ui-sm w-[5em] border border-solid px-1.25 py-0.5 text-right text-[0.82em]"
        type="number"
        [(ngModel)]="character().altitude"
        (change)="onChkAltitude($event)"
      />
      <span class="text-ui-muted shrink-0 text-[0.78em] whitespace-nowrap">マス</span>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <label
        class="text-ui-muted inline-flex cursor-pointer items-center gap-1.25 text-[0.82em] select-none [&_input[type=checkbox]]:cursor-pointer [&_input[type=checkbox]]:[accent-color:var(--ui-accent)]"
      >
        <input type="checkbox" [(ngModel)]="character().isAltitudeIndicate" />高度表示
      </label>
      <label
        class="text-ui-muted inline-flex cursor-pointer items-center gap-1.25 text-[0.82em] select-none [&_input[type=checkbox]]:cursor-pointer [&_input[type=checkbox]]:[accent-color:var(--ui-accent)]"
      >
        <input type="checkbox" [(ngModel)]="character().isDropShadow" />影の表示
      </label>
    </div>
    <div class="flex items-center gap-1.5 text-[0.82em]">
      <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap">位置 X</span>
      <span
        class="text-ui-muted inline-block w-[5em] border border-solid border-transparent bg-transparent text-right text-[0.82em] italic"
        >{{ characterPieceSignals().locationX }}</span
      >
      <span class="text-ui-muted shrink-0 text-[0.78em] whitespace-nowrap">px</span>
    </div>
    <div class="flex items-center gap-1.5 text-[0.82em]">
      <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap">位置 Y</span>
      <span
        class="text-ui-muted inline-block w-[5em] border border-solid border-transparent bg-transparent text-right text-[0.82em] italic"
        >{{ characterPieceSignals().locationY }}</span
      >
      <span class="text-ui-muted shrink-0 text-[0.78em] whitespace-nowrap">px</span>
    </div>
    <div class="flex items-center gap-1.5 text-[0.82em]">
      <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap">回転</span>
      <input
        class="bg-ui-input border-ui-border-input text-ui-text rounded-ui-sm w-[5em] border border-solid px-1.25 py-0.5 text-right text-[0.82em]"
        type="number"
        [ngModel]="characterPieceSignals().rotate"
        (change)="onChkRotate($event)"
      />
      <span class="text-ui-muted shrink-0 text-[0.78em] whitespace-nowrap">°</span>
      <button
        class="text-ui-text border-ui-border-panel hover:border-ui-accent hover:text-ui-accent cursor-pointer rounded-xs border border-solid bg-transparent px-2 py-px text-[0.78em] leading-[1.6]"
        type="button"
        (click)="resetRotate()"
      >
        リセット
      </button>
    </div>
    <div class="flex items-center gap-1.5 text-[0.82em]">
      <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap">縦回転</span>
      <input
        class="bg-ui-input border-ui-border-input text-ui-text rounded-ui-sm w-[5em] border border-solid px-1.25 py-0.5 text-right text-[0.82em]"
        type="number"
        [ngModel]="characterPieceSignals().roll"
        (change)="onChkRoll($event)"
      />
      <span class="text-ui-muted shrink-0 text-[0.78em] whitespace-nowrap">°</span>
      <button
        class="text-ui-text border-ui-border-panel hover:border-ui-accent hover:text-ui-accent cursor-pointer rounded-xs border border-solid bg-transparent px-2 py-px text-[0.78em] leading-[1.6]"
        type="button"
        (click)="resetRoll()"
      >
        リセット
      </button>
    </div>
  </div>

  <!-- データ移行 -->
  @if (legacyCheckTableCount() > 0) {
    <div
      class="bg-ui-elevated border-ui-border-panel col-span-2 flex flex-col gap-1.5 rounded-sm border border-solid px-3 py-2.5"
    >
      <div
        class="border-ui-border-panel text-ui-accent mt-0 mb-2 flex items-center gap-1.25 border-b border-solid pb-1.25 text-[0.72em] font-semibold tracking-[0.06em] uppercase [&_.material-icons]:text-[14px]!"
      >
        <i class="material-icons">upgrade</i>データ移行
      </div>
      <div class="flex items-center gap-2.5 py-1">
        <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap"
          >構造化できる旧チェック表が {{ legacyCheckTableCount() }} 件あります</span
        >
        <button
          class="border-ui-accent text-ui-accent hover:bg-ui-accent-bg inline-flex cursor-pointer items-center gap-1 rounded-xs border border-solid bg-transparent px-2.5 py-0.75 text-[0.78em] leading-[1.6] whitespace-nowrap [&_.material-icons]:text-[14px]!"
          type="button"
          (click)="convertLegacyCheckTables()"
        >
          <i class="material-icons">auto_fix_high</i>構造化テーブルに一括変換
        </button>
      </div>
    </div>
  }

  <!-- ポップアップ設定 -->
  <div
    class="bg-ui-elevated border-ui-border-panel col-span-2 flex flex-col gap-1.5 rounded-sm border border-solid px-3 py-2.5"
  >
    <div
      class="border-ui-border-panel text-ui-accent mt-0 mb-2 flex items-center gap-1.25 border-b border-solid pb-1.25 text-[0.72em] font-semibold tracking-[0.06em] uppercase [&_.material-icons]:text-[14px]!"
    >
      <i class="material-icons">open_in_new</i>ポップアップ設定
    </div>
    <div class="flex flex-col gap-1.5">
      <div
        class="flex items-center gap-1.5 text-[0.82em] [&_input[type=range]]:min-w-0 [&_input[type=range]]:flex-[1_1_0]"
      >
        <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap">横幅</span>
        <input type="range" min="270" max="1000" [(ngModel)]="character().overViewWidth" />
        <input
          class="bg-ui-input border-ui-border-input text-ui-text rounded-ui-sm w-[4.5em] border border-solid px-1.25 py-0.5 text-right text-[0.82em]"
          type="number"
          min="270"
          max="1000"
          [(ngModel)]="character().overViewWidth"
          (change)="onChkPopWidth($event)"
        />
      </div>
      <div
        class="flex items-center gap-1.5 text-[0.82em] [&_input[type=range]]:min-w-0 [&_input[type=range]]:flex-[1_1_0]"
      >
        <span class="text-ui-muted min-w-[6em] shrink-0 text-[0.85em] whitespace-nowrap">高さ最大</span>
        <input type="range" min="250" max="1000" [(ngModel)]="character().overViewMaxHeight" />
        <input
          class="bg-ui-input border-ui-border-input text-ui-text rounded-ui-sm w-[4.5em] border border-solid px-1.25 py-0.5 text-right text-[0.82em]"
          type="number"
          min="250"
          max="1000"
          [(ngModel)]="character().overViewMaxHeight"
          (change)="onChkPopMaxHeight($event)"
        />
      </div>
    </div>
  </div>
</div>
