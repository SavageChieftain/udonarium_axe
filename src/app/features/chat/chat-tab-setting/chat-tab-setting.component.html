<div class="flex flex-row flex-wrap justify-start items-stretch">
  <div class="m-[5px] flex-[1_0_auto] box-border grow-0 max-w-full">
    <div>
      <button (click)="create()">チャットタブを作る</button>
    </div>
    <select
      class="w-[10em]"
      size="10"
      (change)="onSelectTab($event)"
      name="chat-tab-select"
      name="chat-tab-select"
      [ngModel]="selectedTab()?.identifier"
    >
      @for (chatTab of chatTabs; track chatTab) {
        <option value="{{ chatTab.identifier }}">{{ chatTab.name }}</option>
      }
    </select>
    <div class="text-xs">
      <button (click)="onChangeSystemTab()">システム表示先指定</button>
    </div>
    <div class="w-[10em] overflow-hidden text-[14px]">現在システム表示先：<br />{{ systemTab()?.name }}</div>
  </div>
  <div class="m-[5px] flex-[1_0_auto] box-border grow max-w-full">
    @if (!isEmpty && selectedTab()) {
      <div>
        タブ名 :
        <input name="tab-name" [(ngModel)]="tabName" placeholder="Name" [attr.disabled]="!isEditable ? '' : null" />
      </div>
      <hr />
      <div>
        @if (!isDeleted) {
          <div class="pl-[45px]">
            タブ削除を有効にする<input
              name="allow-delete-tab"
              type="checkbox"
              value="allowDeleteTab"
              [(ngModel)]="allowDeleteTab"
            />
          </div>
          <button (click)="upTabIndex()">↑</button>
          <button (click)="downTabIndex()">↓</button>
          <button [disabled]="isSaving()" (click)="save()">
            <div class="relative">
              <div [class.invisible]="isSaving()">保存</div>
              @if (isSaving()) {
                <div class="flex items-center justify-center absolute inset-0 text-[0.9em]">
                  {{ progressPercent() }}%
                </div>
              }
            </div>
          </button>
          <span class="inline-block w-[2em]"></span>
          <button
            class="danger"
            (click)="delete()"
            [attr.disabled]="chatTabs.length <= 1 ? '' : null"
            [attr.disabled]="!allowDeleteTab ? '' : null"
          >
            選択タブ削除</button
          ><br />
        }
        @if (isDeleted) {
          <button (click)="restore()">元に戻す</button>
        }
        @if (!isDeleted) {
          <hr />
          <button (click)="saveLog()" class="w-[9em]">ログ保存</button
          ><span class="text-xs">リストから選んだログを保存</span><br />
          <button (click)="saveAllLog()" class="w-[9em]">全タブログ保存</button
          ><span class="text-xs">時系列順にまとめて保存</span><br />
          <span>CoCログ形式にする</span
          ><input name="mode-coc-log" type="checkbox" value="modeCocLog" [(ngModel)]="modeCocLog" /><br />
        }
        <hr />
        <br /><br />
        @if (!isDeleted) {
          ログの消去機能を有効にする<input
            name="allow-delete-log"
            type="checkbox"
            value="allowDeleteLog"
            [(ngModel)]="allowDeleteLog"
          /><br />
          <button
            class="danger"
            (click)="deleteLog()"
            [attr.disabled]="chatTabs.length <= 1 ? '' : null"
            class="w-[9em]"
            [attr.disabled]="!allowDeleteLog ? '' : null"
          >
            選択ログ消去
          </button>
          <button
            class="danger w-[9em]"
            (click)="deleteLogALL()"
            [attr.disabled]="chatTabs.length <= 1 ? '' : null"
            [attr.disabled]="!allowDeleteLog ? '' : null"
          >
            全ログ消去
          </button>
        }
      </div>
    }
  </div>
</div>
@if (isEmpty) {
  <div class="text-xs">
    ※チャットタブが１つも作成されていません。「チャットタブを作る」からチャットタブを作成することができます。
  </div>
}
