<div>
  <div id="tachie-component_">
    <div class="tachie-image-box" #tachieArea style="height:0px,width:100%">
      @if (chatTab) {
        @if (chatTab.tachieDispFlag) {
          @if (isTachieDispMode) {
            @for (slot of tachieSlots(); track slot.pos) {
              @if (0 < slot.imageFileUrl.length) {
                <img
                  [class]="'tachie-image pos' + (slot.pos < 10 ? '0' : '') + slot.pos"
                  [src]="slot.imageFileUrl | safe: 'resourceUrl'"
                  [ngStyle]="{
                    transform:
                      'translateX( calc( (' +
                      tachieAreaWidth() +
                      'px - 100% ) / 11 * ' +
                      slot.pos +
                      ' ) ) translateY(' +
                      tachieY_Pos +
                      'px)',
                    'z-index': slot.zIndex,
                    opacity: slot.opacity,
                    height: slot.height + 'px',
                  }"
                  (mousedown)="tachieClick(slot.pos)"
                />
              }
            }
          }
        }
      }
    </div>
  </div>
</div>
