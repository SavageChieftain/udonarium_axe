<div>
  <form name="chat-portrait">
    <div
      id="portrait-component_"
      #portraitArea
      class="relative overflow-visible"
      [ngStyle]="{ height: portraitAreaHeight() + 'px' }"
    >
      <chat-portrait-img
        [chatTabidentifier]="chatTabidentifier()"
        [isTilteTop]="false"
        [dispByMouse]="true"
      ></chat-portrait-img>
    </div>
  </form>
</div>
