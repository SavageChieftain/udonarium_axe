<div id="file-list">
  <div class="table">
    <div class="table-cell">
      <div>第1色</div>
      <color-picker
        [value]="chatColorCode(0)"
        [hideAlpha]="true"
        format="hex"
        (valueChange)="onChangeColor($event, 0)"
      ></color-picker>
    </div>
    <div class="table-cell">
      <div>第2色</div>
      <color-picker
        [value]="chatColorCode(1)"
        [hideAlpha]="true"
        format="hex"
        (valueChange)="onChangeColor($event, 1)"
      ></color-picker>
    </div>

    <div class="table-cell">
      <div>第3色</div>
      <color-picker
        [value]="chatColorCode(2)"
        [hideAlpha]="true"
        format="hex"
        (valueChange)="onChangeColor($event, 2)"
      ></color-picker>
    </div>
  </div>
</div>
