<div class="flex items-end gap-4">
  <div class="flex flex-col items-center gap-1.5">
    <label class="text-ui-muted text-[11px] whitespace-nowrap">{{
      'feature.chat.colorSetting.color1' | transloco
    }}</label>
    <input
      type="color"
      class="rounded-ui-sm border-ui-border-panel bg-ui-input hover:border-ui-accent h-7.5 w-11 cursor-pointer border border-solid p-0.5 transition-colors"
      name="color01"
      list="color-list_01"
      [value]="chatColorCode(0)"
      (change)="onChangeColor($event, 0)"
    />
    <datalist id="color-list_01">
      <option value="#000000"></option>
      <option value="#FF0000"></option>
      <option value="#999999"></option>
      <option value="#990000"></option>
      <option value="#FF6633"></option>
      <option value="#669933"></option>
      <option value="#00CC33"></option>
      <option value="#009966"></option>
      <option value="#33CCFF"></option>
      <option value="#0099FF"></option>
      <option value="#3366FF"></option>
      <option value="#003399"></option>
      <option value="#9933CC"></option>
      <option value="#663366"></option>
      <option value="#FF66FF"></option>
    </datalist>
  </div>

  <div class="flex flex-col items-center gap-1.5">
    <label class="text-ui-muted text-[11px] whitespace-nowrap">{{
      'feature.chat.colorSetting.color2' | transloco
    }}</label>
    <input
      type="color"
      class="rounded-ui-sm border-ui-border-panel bg-ui-input hover:border-ui-accent h-7.5 w-11 cursor-pointer border border-solid p-0.5 transition-colors"
      name="color02"
      list="color-list_02"
      [value]="chatColorCode(1)"
      (change)="onChangeColor($event, 1)"
    />
    <datalist id="color-list_02">
      <option value="#000000"></option>
      <option value="#FF0000"></option>
      <option value="#999999"></option>
      <option value="#990000"></option>
      <option value="#FF6633"></option>
      <option value="#669933"></option>
      <option value="#00CC33"></option>
      <option value="#009966"></option>
      <option value="#33CCFF"></option>
      <option value="#0099FF"></option>
      <option value="#3366FF"></option>
      <option value="#003399"></option>
      <option value="#9933CC"></option>
      <option value="#663366"></option>
      <option value="#FF66FF"></option>
    </datalist>
  </div>

  <div class="flex flex-col items-center gap-1.5">
    <label class="text-ui-muted text-[11px] whitespace-nowrap">{{
      'feature.chat.colorSetting.color3' | transloco
    }}</label>
    <input
      type="color"
      class="rounded-ui-sm border-ui-border-panel bg-ui-input hover:border-ui-accent h-7.5 w-11 cursor-pointer border border-solid p-0.5 transition-colors"
      name="color03"
      list="color-list_03"
      [value]="chatColorCode(2)"
      (change)="onChangeColor($event, 2)"
    />
    <datalist id="color-list_03">
      <option value="#000000"></option>
      <option value="#FF0000"></option>
      <option value="#999999"></option>
      <option value="#990000"></option>
      <option value="#FF6633"></option>
      <option value="#669933"></option>
      <option value="#00CC33"></option>
      <option value="#009966"></option>
      <option value="#33CCFF"></option>
      <option value="#0099FF"></option>
      <option value="#3366FF"></option>
      <option value="#003399"></option>
      <option value="#9933CC"></option>
      <option value="#663366"></option>
      <option value="#FF66FF"></option>
    </datalist>
  </div>
</div>

<div class="mt-4 flex flex-col gap-2">
  <div class="text-ui-muted text-[11px]">{{ 'feature.chat.colorSetting.preview' | transloco }}</div>

  @for (theme of themes; track theme) {
    <div
      class="rounded-ui-sm flex flex-col gap-1.5 p-2"
      [style.background-color]="theme === 'dark' ? '#161b22' : '#ded3e8'"
    >
      <div class="text-[10px] tracking-[0.04em] uppercase" [style.color]="theme === 'dark' ? '#8b949e' : '#5b4074'">
        {{ 'feature.chat.colorSetting.theme.' + theme | transloco }}
      </div>

      @for (slot of slots; track slot) {
        <div
          class="rounded-ui-sm box-border border border-solid px-2 py-1"
          [ngStyle]="chatColorCode(slot) | chatColorStyle: theme"
          [style.border-color]="'var(--ui-bubble-caret-border)'"
        >
          <div class="text-[11px] font-medium opacity-90">{{ speakerName }}</div>
          <div class="text-[12px]">{{ 'feature.chat.colorSetting.sample' | transloco }}</div>
        </div>
      }
    </div>
  }
</div>
