<div id="file-list">
  <div class="box-border p-[5px] table w-full">
    <div class="table-cell" style="width: 16em">立ち絵をウィンドウ内に表示:</div>
    <div class="table-cell">
      <input
        type="checkbox"
        value="isPortraitInWindow"
        [(ngModel)]="chatTabList.isPortraitInWindow"
        name="portraitInWindow"
        (click)="changePortraitInWindow()"
      />
    </div>
  </div>
  <div class="box-border p-[5px] table w-full">
    <div class="table-cell" style="width: 16em">
      マウスのウィンドウ離脱時<br />
      ウィンドウ外の立ち絵を保持:
    </div>
    <div class="table-cell">
      <input
        type="checkbox"
        value="isKeepPortraitOutWindow"
        [(ngModel)]="chatTabList.isKeepPortraitOutWindow"
        name="isKeepPortraitOutWindow"
        (click)="changeKeepPortraitOutWindow()"
        [attr.disabled]="chatTabList.isPortraitInWindow ? '' : null"
      />
    </div>
  </div>
  <div class="box-border p-[5px] table w-full">
    <div class="table-cell" style="width: 16em">簡易表示で時間を表示:</div>
    <div class="table-cell">
      <input
        type="checkbox"
        value="simpleDispFlagTime"
        [(ngModel)]="chatTabList.simpleDispFlagTime"
        name="hideInventory"
        (click)="changeDispFlagTime()"
      />
    </div>
  </div>
  <div class="box-border p-[5px] table w-full">
    <div class="table-cell" style="width: 16em">簡易表示でIDを表示:</div>
    <div class="table-cell">
      <input
        type="checkbox"
        value="simpleDispFlagUserId"
        [(ngModel)]="chatTabList.simpleDispFlagUserId"
        name="hideInventory"
        (click)="changeDispFlagUserId()"
      />
    </div>
  </div>
</div>
