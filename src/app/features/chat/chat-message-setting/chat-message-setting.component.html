<form name="chat-setting" class="px-3 py-2">
  <section class="mb-3">
    <h3
      class="border-ui-border-panel text-ui-dim m-0 mb-1.5 border-b border-solid pb-1 text-[10px] font-semibold tracking-[0.06em] uppercase"
    >
      {{ 'feature.chat.messageSetting.sectionPortrait' | transloco }}
    </h3>
    <label class="flex cursor-pointer items-center justify-between gap-2 py-1">
      <span class="text-ui-muted flex-1 text-[12px]">{{
        'feature.chat.messageSetting.showPortraitThisTab' | transloco
      }}</span>
      @if (chatTab) {
        <input type="checkbox" [(ngModel)]="chatTab.portraitDisplayFlag" name="portraitDisplayFlag" />
      } @else {
        <input type="checkbox" name="portraitDisplayFlag" disabled />
      }
    </label>
    <label class="flex cursor-pointer items-center justify-between gap-2 py-1">
      <span class="text-ui-muted flex-1 text-[12px]">{{ 'feature.chat.messageSetting.portraitSize' | transloco }}</span>
      <input
        type="number"
        class="rounded-ui-sm border-ui-border-panel bg-ui-input text-ui-text w-16 border border-solid px-1 py-0.5 text-right text-[12px]"
        [(ngModel)]="chatTabList.portraitHeight"
        min="{{ chatTabList.minPortraitSize }}"
        max="{{ chatTabList.maxPortraitSize }}"
        name="portraitHeight"
        (change)="onChkHeight($event)"
      />
    </label>
    <label class="flex cursor-pointer items-center justify-between gap-2 py-1">
      <span class="text-ui-muted flex-1 text-[12px]">{{
        'feature.chat.messageSetting.portraitInWindow' | transloco
      }}</span>
      <input
        type="checkbox"
        [(ngModel)]="chatTabList.isPortraitInWindow"
        name="portraitInWindow"
        (click)="changePortraitInWindow()"
      />
    </label>
    <label class="flex cursor-pointer items-center justify-between gap-2 py-1">
      <span class="text-ui-muted flex-1 text-[12px]">{{
        'feature.chat.messageSetting.keepPortraitOutWindow' | transloco
      }}</span>
      <input
        type="checkbox"
        [(ngModel)]="chatTabList.isKeepPortraitOutWindow"
        name="isKeepPortraitOutWindow"
        (click)="changeKeepPortraitOutWindow()"
        [attr.disabled]="chatTabList.isPortraitInWindow ? '' : null"
      />
    </label>
  </section>

  <section class="mb-0">
    <h3
      class="border-ui-border-panel text-ui-dim m-0 mb-1.5 border-b border-solid pb-1 text-[10px] font-semibold tracking-[0.06em] uppercase"
    >
      {{ 'feature.chat.messageSetting.sectionSimple' | transloco }}
    </h3>
    <label class="flex cursor-pointer items-center justify-between gap-2 py-1">
      <span class="text-ui-muted flex-1 text-[12px]">{{
        'feature.chat.messageSetting.enableSimpleThisTab' | transloco
      }}</span>
      @if (chatTab) {
        <input
          type="checkbox"
          [(ngModel)]="chatTab.chatSimpleDispFlag"
          name="chatSimpleDispFlag"
          (click)="changeSimpleDisp()"
        />
      } @else {
        <input type="checkbox" name="chatSimpleDispFlag" disabled />
      }
    </label>
    <label class="flex cursor-pointer items-center justify-between gap-2 py-1">
      <span class="text-ui-muted flex-1 text-[12px]">{{ 'feature.chat.messageSetting.showTime' | transloco }}</span>
      <input
        type="checkbox"
        [(ngModel)]="chatTabList.simpleDispFlagTime"
        name="simpleDispFlagTime"
        (click)="changeDispFlagTime()"
        [attr.disabled]="chatTab?.chatSimpleDispFlag ? null : ''"
      />
    </label>
    <label class="flex cursor-pointer items-center justify-between gap-2 py-1">
      <span class="text-ui-muted flex-1 text-[12px]">{{ 'feature.chat.messageSetting.showUserId' | transloco }}</span>
      <input
        type="checkbox"
        [(ngModel)]="chatTabList.simpleDispFlagUserId"
        name="simpleDispFlagUserId"
        (click)="changeDispFlagUserId()"
        [attr.disabled]="chatTab?.chatSimpleDispFlag ? null : ''"
      />
    </label>
  </section>

  <section class="mb-0">
    <h3
      class="border-ui-border-panel text-ui-dim m-0 mb-1.5 border-b border-solid pb-1 text-[10px] font-semibold tracking-[0.06em] uppercase"
    >
      {{ 'feature.chat.messageSetting.sectionScroll' | transloco }}
    </h3>
    <label
      class="flex cursor-pointer items-center justify-between gap-2 py-1"
      [title]="'feature.chat.messageSetting.autoFollowScrollTooltip' | transloco"
    >
      <span class="text-ui-muted flex-1 text-[12px]">{{
        'feature.chat.messageSetting.autoFollowScroll' | transloco
      }}</span>
      <input
        type="checkbox"
        name="auto-follow-scroll"
        [ngModel]="autoFollowScroll()"
        (ngModelChange)="setAutoFollowScroll($event)"
      />
    </label>
  </section>
</form>
