<div>
  <div id="portrait-component_">
    <div class="portrait-image-box" #portraitArea style="height:0px,width:100%">
      @if (chatTab) {
        @if (chatTab.portraitDisplayFlag) {
          @if (isPortraitDispMode) {
            @for (slot of portraitSlots(); track slot.pos) {
              @if (slot.imageFileUrl) {
                <img
                  [class]="'portrait-image pos' + (slot.pos < 10 ? '0' : '') + slot.pos"
                  [src]="slot.imageFileUrl | safe: 'resourceUrl'"
                  [ngStyle]="{
                    transform:
                      'translateX( calc( (' +
                      portraitAreaWidth() +
                      'px - 100% ) / 11 * ' +
                      slot.pos +
                      ' ) ) translateY(' +
                      portraitYPos +
                      'px)',
                    'z-index': slot.zIndex,
                    opacity: slot.opacity,
                    height: slot.height + 'px',
                  }"
                  (mousedown)="portraitClick(slot.pos)"
                />
              }
            }
          }
        }
      }
    </div>
  </div>
</div>
