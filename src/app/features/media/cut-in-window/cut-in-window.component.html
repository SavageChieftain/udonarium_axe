@if (cutIn) {
  <div class="relative size-full overflow-hidden p-0" #cutInArea>
    <youtube-player
      #videoPlayerComponent
      [style.visibility]="isVisible()"
      [videoId]="videoId"
      [width]="youTubeWidth"
      [height]="youTubeHeight"
      suggestedQuality="default"
      [playerVars]="{
        autoplay: 1,
        controls: 0,
        start: +(cutIn.videoStart ?? 0),
        loop: cutIn && cutIn.isLoop ? 1 : 0,
        playsinline: 1,
        rel: 0,
        listType: 'playlist',
        list: playListId ? playListId : undefined,
        playlist: playListId ? undefined : videoId,
        disablekb: 1,
        fs: 0,
        iv_load_policy: 3,
        modestbranding: 1,
      }"
      (ready)="onPlayerReady($event)"
      (stateChange)="onPlayerStateChange($event)"
    >
    </youtube-player>
    @if (videoId) {
      <div class="yt-click-guard"></div>
    }
    @if (!videoId) {
      <img class="size-full" [src]="cutInImageUrl() | safe: 'resourceUrl'" />
    }
  </div>
}
