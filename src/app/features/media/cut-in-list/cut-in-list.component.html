<div class="ci-layout">
  <!-- ── 左カラム: 一覧 ── -->
  <aside class="ci-list-col">
    <div class="list-header">
      <span class="col-heading">カットイン</span>
      <button type="button" class="icon-btn" title="新しいカットインを作る" (click)="createCutIn()">
        <i class="material-icons">add</i>
      </button>
    </div>

    <ul class="ci-list" role="listbox">
      @for (cutIn of getCutIns(); track cutIn.identifier) {
        <li
          class="ci-list-item"
          [class.selected]="selectedCutIn?.identifier === cutIn.identifier"
          (click)="selectCutIn(cutIn.identifier)"
          role="option"
          [attr.aria-selected]="selectedCutIn?.identifier === cutIn.identifier"
        >
          <i class="material-icons ci-item-icon">slideshow</i>
          <span class="ci-item-name">{{ cutIn.name }}</span>
        </li>
      }
    </ul>
  </aside>

  <!-- ── 右カラム: 詳細 ── -->
  <main class="ci-detail-col">
    @if (isEmpty) {
      <div class="empty-state">
        <i class="material-icons">slideshow</i>
        <p>カットインがありません</p>
        <button type="button" class="primary-btn" (click)="createCutIn()">カットインを作成</button>
      </div>
    }

    @if (!isEmpty && !selectedCutIn) {
      <div class="empty-state">
        <i class="material-icons">touch_app</i>
        <p>左のリストから選択してください</p>
      </div>
    }

    @if (selectedCutIn) {
      <cut-in-editor [cutIn]="selectedCutIn" [isEditable]="isEditable" />
      <div class="ci-actions">
        <button type="button" class="primary-btn" (click)="save()" [disabled]="isSaving()">
          <i class="material-icons">save</i>{{ isSaving() ? progressPercent() + '%' : '保存' }}
        </button>
        <button type="button" class="danger-btn" (click)="delete()"><i class="material-icons">delete</i>削除</button>
      </div>
    }
  </main>
</div>
