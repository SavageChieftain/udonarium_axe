<div class="text-ui-text grid h-full grid-cols-[180px_1fr] overflow-hidden text-[13px]">
  <!-- ── 左カラム: 一覧 ── -->
  <aside class="border-ui-border-panel bg-ui-panel flex flex-col overflow-hidden border-r border-solid">
    <div class="border-ui-border-panel flex shrink-0 items-center justify-between border-b border-solid px-2.5 py-2">
      <span class="text-ui-muted text-[11px] font-semibold tracking-wider uppercase">カットイン</span>
      <button
        class="border-ui-border-panel text-ui-muted hover:bg-ui-hover hover:text-ui-text rounded-ui-sm inline-flex size-6.5 cursor-pointer items-center justify-center border border-solid bg-transparent p-0 transition-[background,color] [&_.material-icons]:text-base!"
        type="button"
        title="新しいカットインを作る"
        (click)="createCutIn()"
      >
        <i class="material-icons">add</i>
      </button>
    </div>

    <ul class="m-0 flex-1 list-none overflow-y-auto px-0 py-1" role="listbox">
      @for (cutIn of getCutIns(); track cutIn.identifier) {
        <li
          class="text-ui-muted hover:bg-ui-hover hover:text-ui-text mx-1 flex cursor-pointer items-center gap-1.5 rounded-sm px-2.5 py-1.5 transition-[background]"
          [class.bg-ui-accent-bg!]="selectedCutIn?.identifier === cutIn.identifier"
          [class.text-ui-accent!]="selectedCutIn?.identifier === cutIn.identifier"
          (click)="selectCutIn(cutIn.identifier)"
          role="option"
          [attr.aria-selected]="selectedCutIn?.identifier === cutIn.identifier"
        >
          <i class="material-icons shrink-0 text-[15px]! opacity-70">slideshow</i>
          <span class="truncate text-[13px]">{{ cutIn.name }}</span>
        </li>
      }
    </ul>
  </aside>

  <!-- ── 右カラム: 詳細 ── -->
  <main
    class="bg-ui-elevated flex flex-col overflow-hidden [&_cut-in-editor]:flex [&_cut-in-editor]:min-h-0 [&_cut-in-editor]:flex-1 [&_cut-in-editor]:flex-col [&_cut-in-editor]:overflow-hidden"
  >
    @if (isEmpty) {
      <div
        class="text-ui-dim flex flex-1 flex-col items-center justify-center gap-2.5 p-6 text-center [&_.material-icons]:text-[40px]! [&_.material-icons]:opacity-40"
      >
        <i class="material-icons">slideshow</i>
        <p class="m-0 text-[13px]">カットインがありません</p>
        <button
          class="bg-ui-accent rounded-ui-sm inline-flex cursor-pointer items-center gap-1 border-none px-3 py-1.25 text-[13px] font-semibold text-white transition-opacity hover:opacity-85 disabled:cursor-not-allowed disabled:opacity-50 [&_.material-icons]:text-[15px]!"
          type="button"
          (click)="createCutIn()"
        >
          カットインを作成
        </button>
      </div>
    }

    @if (!isEmpty && !selectedCutIn) {
      <div
        class="text-ui-dim flex flex-1 flex-col items-center justify-center gap-2.5 p-6 text-center [&_.material-icons]:text-[40px]! [&_.material-icons]:opacity-40"
      >
        <i class="material-icons">touch_app</i>
        <p class="m-0 text-[13px]">左のリストから選択してください</p>
      </div>
    }

    @if (selectedCutIn) {
      <cut-in-editor [cutIn]="selectedCutIn" [isEditable]="isEditable" />
      <div class="border-ui-border-panel bg-ui-panel flex shrink-0 gap-2 border-t border-solid px-3.5 py-2.5">
        <button
          class="bg-ui-accent rounded-ui-sm inline-flex cursor-pointer items-center gap-1 border-none px-3 py-1.25 text-[13px] font-semibold text-white transition-opacity hover:opacity-85 disabled:cursor-not-allowed disabled:opacity-50 [&_.material-icons]:text-[15px]!"
          type="button"
          (click)="save()"
          [disabled]="isSaving()"
        >
          <i class="material-icons">save</i>{{ isSaving() ? progressPercent() + '%' : '保存' }}
        </button>
        <button
          class="text-ui-danger border-ui-danger hover:bg-ui-danger-bg rounded-ui-sm inline-flex cursor-pointer items-center gap-1 border border-solid bg-transparent px-3 py-1.25 text-[13px] font-semibold transition-[background,color] [&_.material-icons]:text-[15px]!"
          type="button"
          (click)="delete()"
        >
          <i class="material-icons">delete</i>削除
        </button>
      </div>
    }
  </main>
</div>
