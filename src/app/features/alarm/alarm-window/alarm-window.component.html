<div class="component">
  <ng-container *ngTemplateOutlet="alarmTop"></ng-container>
</div>

<ng-template #alarmTop>
  <form class="is-sticky-top" name="alarm-window">
    <div class="tab">
      <div>
        {{ title }}
      </div>
      <div>{{ time }}秒経過しました</div>
    </div>
  </form>
</ng-template>
