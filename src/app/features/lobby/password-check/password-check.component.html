<form name="password-check" #passwordForm="ngForm">
  <div>
    パスワード:
    <input
      name="password"
      class="is-caret"
      [ngModel]="password()"
      (ngModelChange)="onPasswordChange($event)"
      [ngModelOptions]="{ standalone: true }"
      placeholder="パスワード"
      #passwordInput
    />
  </div>
  <button type="submit" (click)="submit()">入室</button>
</form>
<div>
  <span style="font-size: 12px">{{ help() }}</span>
</div>
