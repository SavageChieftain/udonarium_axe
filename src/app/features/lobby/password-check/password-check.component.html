<form name="password-check" #passwordForm="ngForm" (ngSubmit)="submit()">
  <div class="password-form">
    <label class="field-label" for="pw-input">パスワード</label>
    <input
      id="pw-input"
      class="password-input"
      name="password"
      [ngModel]="password()"
      (ngModelChange)="onPasswordChange($event)"
      [ngModelOptions]="{ standalone: true }"
      placeholder="パスワードを入力"
      #passwordInput
    />
    <button class="btn-primary" type="submit">
      <i class="material-icons" style="font-size: 14px; vertical-align: middle; margin-right: 3px">login</i>入室
    </button>
  </div>
</form>
<p class="help-text">{{ help() }}</p>
