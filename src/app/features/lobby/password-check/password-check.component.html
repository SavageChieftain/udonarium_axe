<form name="password-check" #passwordForm="ngForm" (ngSubmit)="submit()">
  <div>
    パスワード:
    <input
      name="password"
      [ngModel]="password()"
      (ngModelChange)="onPasswordChange($event)"
      [ngModelOptions]="{ standalone: true }"
      placeholder="パスワード"
      #passwordInput
    />
  </div>
  <button type="submit">入室</button>
</form>
<div>
  <span style="font-size: 12px">{{ help() }}</span>
</div>
