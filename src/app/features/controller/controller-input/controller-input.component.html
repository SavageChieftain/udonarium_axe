<div class="bg-ui-panel flex items-start gap-2 p-2" [ngClass]="{ 'bg-ui-elevated text-ui-text': isDirect }">
  <!-- アバター（立ち絵ナビゲーションオーバーレイ） -->
  <div
    class="rounded-ui-sm border-ui-border-panel bg-ui-input relative flex size-[52px] shrink-0 items-center justify-center overflow-hidden border border-solid"
  >
    @if (0 < imageFile().url.length) {
      <img class="size-full object-cover object-[50%_0%]" [src]="imageFile().url | safe: 'resourceUrl'" />
    } @else {
      <i class="material-icons text-ui-dim text-[24px]">person</i>
    }
    @if (1 <= portraitCount()) {
      <div
        class="rounded-b-ui-sm absolute inset-x-0 bottom-0 flex h-[18px] items-center justify-between overflow-hidden bg-[rgba(0,0,0,0.55)] px-[2px]"
      >
        <button
          type="button"
          class="flex shrink-0 cursor-pointer items-center border-none bg-transparent p-0 leading-none text-white/75 transition-colors hover:text-white disabled:cursor-default disabled:text-white/25 [&_i]:text-[14px]"
          [disabled]="portraitIndex() <= 0"
          (click)="stepPortrait(-1)"
          aria-label="前の立ち絵"
        >
          <i class="material-icons">chevron_left</i>
        </button>
        <span class="min-w-0 flex-1 truncate text-center text-[10px] text-white/90" [title]="portraitLabel">{{
          portraitLabel
        }}</span>
        <button
          type="button"
          class="flex shrink-0 cursor-pointer items-center border-none bg-transparent p-0 leading-none text-white/75 transition-colors hover:text-white disabled:cursor-default disabled:text-white/25 [&_i]:text-[14px]"
          [disabled]="portraitIndex() >= portraitCount() - 1"
          (click)="stepPortrait(1)"
          aria-label="次の立ち絵"
        >
          <i class="material-icons">chevron_right</i>
        </button>
      </div>
    }
  </div>

  <!-- 発言者コントロール: sendFrom + 色 + 選択数 -->
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <div class="flex min-w-0 items-center gap-1">
      <ng-select
        name="send-from"
        class="ud-select min-w-0 flex-1"
        [ngModel]="sendFrom()"
        (ngModelChange)="sendFrom.set($event)"
        [searchable]="false"
        [clearable]="false"
      >
        @if (!onlyCharacters()) {
          <ng-option [value]="myPeer.identifier">{{ myPeer.name }}（あなた）</ng-option>
        }
        @for (gameCharacter of gameCharacters(); track gameCharacter.identifier) {
          <ng-option [value]="gameCharacter.identifier">{{ gameCharacter.name }}</ng-option>
        }
      </ng-select>
    </div>
    <div class="flex min-w-0 flex-wrap items-center gap-1">
      <div
        class="box-border inline-block size-[18px] shrink-0 cursor-pointer"
        (click)="setColorNum(0)"
        [ngStyle]="colorSelectorStyle(0)"
      ></div>
      <div
        class="box-border inline-block size-[18px] shrink-0 cursor-pointer"
        (click)="setColorNum(1)"
        [ngStyle]="colorSelectorStyle(1)"
      ></div>
      <div
        class="box-border inline-block size-[18px] shrink-0 cursor-pointer"
        (click)="setColorNum(2)"
        [ngStyle]="colorSelectorStyle(2)"
      ></div>
      <button
        class="rounded-ui-sm border-ui-border-panel text-ui-muted hover:bg-ui-hover hover:text-ui-text flex cursor-pointer items-center border border-solid bg-transparent px-[3px] py-px [&_i]:text-[14px]"
        (click)="shoeColorSetting()"
        title="色設定"
      >
        <i class="material-icons">settings</i>
      </button>
      <span class="text-ui-muted ml-auto text-[11px] whitespace-nowrap">選択 {{ selectNum() }}</span>
      <button
        class="rounded-ui-sm border-ui-border-panel text-ui-muted hover:bg-ui-hover hover:text-ui-text cursor-pointer border border-solid bg-transparent px-[6px] py-[2px] text-[11px] whitespace-nowrap"
        (click)="allBoxCheck()"
      >
        @if (0 !== selectNum()) {
          全解除
        } @else {
          全選択
        }
      </button>
    </div>
  </div>
</div>
