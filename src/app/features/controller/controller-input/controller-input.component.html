<div class="table" [ngClass]="{ 'direct-message': isDirect }">
  <div class="table">
    <div class="table-cell imagebox">
      @if (0 < imageFile().url.length) {
        <img class="image" [src]="imageFile().url | safe: 'resourceUrl'" />
      }
    </div>
    <div class="table-cell">
      <div class="table">
        <div class="table-cell">
          <div>
            <ng-select
              name="send-from"
              class="ud-select w-[10em]"
              [ngModel]="sendFrom()"
              (ngModelChange)="sendFrom.set($event)"
              [searchable]="false"
              [clearable]="false"
            >
              @if (!onlyCharacters()) {
                <ng-option [value]="myPeer.identifier">{{ myPeer.name }}（あなた）</ng-option>
              }
              @for (gameCharacter of gameCharacters(); track gameCharacter.identifier) {
                <ng-option [value]="gameCharacter.identifier">{{ gameCharacter.name }} </ng-option>
              }
            </ng-select>
          </div>
          <div>
            <div class="color" (click)="setColorNum(0)" [ngStyle]="colorSelectorStyle(0)"></div>
            <div class="color" (click)="setColorNum(1)" [ngStyle]="colorSelectorStyle(1)"></div>
            <div class="color" (click)="setColorNum(2)" [ngStyle]="colorSelectorStyle(2)"></div>
            <button class="color-setting small-font" (click)="shoeColorSetting()">
              <i class="material-icons small-font">settings</i>色設定
            </button>
          </div>
        </div>
        <div class="table-cell">
          <div class="text-[0.8em] text-right">
            選択数：{{ selectNum() }}<br />
            <button class="color-setting small-font w-[7em]" (click)="allBoxCheck()">
              @if (0 !== selectNum()) {
                全解除口→
              }
              @if (0 === selectNum()) {
                全選択〆→
              }
            </button>
          </div>
        </div>
      </div>

      <!-- 立ち絵ここから-->
      <div class="portrait-tag">
        @if (1 <= portraitCount()) {
          <div class="portrait-nav">
            <button
              type="button"
              class="portrait-nav-btn"
              [disabled]="portraitIndex() <= 0"
              (click)="stepPortrait(-1)"
              aria-label="前の立ち絵"
            >
              <i class="material-icons">chevron_left</i>
            </button>
            <span class="portrait-nav-label" [title]="portraitLabel">{{ portraitLabel }}</span>
            <button
              type="button"
              class="portrait-nav-btn"
              [disabled]="portraitIndex() >= portraitCount() - 1"
              (click)="stepPortrait(1)"
              aria-label="次の立ち絵"
            >
              <i class="material-icons">chevron_right</i>
            </button>
          </div>
        }
      </div>
      <!-- ここまで-->
    </div>
  </div>

  <hr />
  <div class="w-full">
    バフ/デバッファー
    <div class="float-right text-right">
      隠す
      <input name="buff_hide_chk" type="checkbox" (change)="onBuffHideChkChange($event)" />
    </div>
    <form name="controller-input-buff">
      <div [hidden]="buffHideIsChk">
        <textarea
          name="buff-text"
          class="controller-input"
          placeholder="Enterで送信"
          [ngModel]="text()"
          (ngModelChange)="text.set($event)"
          [ngModelOptions]="{ standalone: true }"
          (input)="onInput()"
          (keydown.enter)="sendChat($event)"
          #textArea
        ></textarea>
        <button type="submit" (click)="sendChat(null)">実行</button>
      </div>
    </form>
  </div>
</div>
