<div class="ci-root" [ngClass]="{ 'direct-message': isDirect }">
  <!-- アバター（立ち絵ナビゲーションオーバーレイ） -->
  <div class="ci-avatar">
    @if (0 < imageFile().url.length) {
      <img class="ci-avatar-img" [src]="imageFile().url | safe: 'resourceUrl'" />
    } @else {
      <i class="material-icons ci-avatar-placeholder">person</i>
    }
    @if (1 <= portraitCount()) {
      <div class="portrait-nav">
        <button
          type="button"
          class="portrait-nav-btn"
          [disabled]="portraitIndex() <= 0"
          (click)="stepPortrait(-1)"
          aria-label="前の立ち絵"
        >
          <i class="material-icons">chevron_left</i>
        </button>
        <span class="portrait-nav-label" [title]="portraitLabel">{{ portraitLabel }}</span>
        <button
          type="button"
          class="portrait-nav-btn"
          [disabled]="portraitIndex() >= portraitCount() - 1"
          (click)="stepPortrait(1)"
          aria-label="次の立ち絵"
        >
          <i class="material-icons">chevron_right</i>
        </button>
      </div>
    }
  </div>

  <!-- 発言者コントロール: sendFrom + 色 + 選択数 -->
  <div class="ci-controls">
    <div class="ci-row">
      <ng-select
        name="send-from"
        class="ud-select ci-select"
        [ngModel]="sendFrom()"
        (ngModelChange)="sendFrom.set($event)"
        [searchable]="false"
        [clearable]="false"
      >
        @if (!onlyCharacters()) {
          <ng-option [value]="myPeer.identifier">{{ myPeer.name }}（あなた）</ng-option>
        }
        @for (gameCharacter of gameCharacters(); track gameCharacter.identifier) {
          <ng-option [value]="gameCharacter.identifier">{{ gameCharacter.name }}</ng-option>
        }
      </ng-select>
    </div>
    <div class="ci-row ci-row--colors">
      <div class="ci-color" (click)="setColorNum(0)" [ngStyle]="colorSelectorStyle(0)"></div>
      <div class="ci-color" (click)="setColorNum(1)" [ngStyle]="colorSelectorStyle(1)"></div>
      <div class="ci-color" (click)="setColorNum(2)" [ngStyle]="colorSelectorStyle(2)"></div>
      <button class="ci-color-btn" (click)="shoeColorSetting()" title="色設定">
        <i class="material-icons">settings</i>
      </button>
      <span class="ci-select-count">選択 {{ selectNum() }}</span>
      <button class="ci-all-btn" (click)="allBoxCheck()">
        @if (0 !== selectNum()) {
          全解除
        } @else {
          全選択
        }
      </button>
    </div>
  </div>
</div>
