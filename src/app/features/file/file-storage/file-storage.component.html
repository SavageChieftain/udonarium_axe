<div class="fs-layout">
  <!-- タグフィルター -->
  <div class="tag-bar">
    @for (tag of tagList; track tag) {
      <label class="tag-pill">
        <input
          name="image-chg"
          type="radio"
          [value]="tag"
          [ngModel]="selectTag()"
          (ngModelChange)="selectTag.set($event)"
          (change)="resetBtn()"
        />
        <span>{{ !tag ? '未設定' : tag }}</span>
      </label>
    }
  </div>

  <!-- ドロップゾーン -->
  <label class="drop-zone">
    <i class="material-icons drop-zone-icon">add_photo_alternate</i>
    <span class="drop-zone-main">ここに画像をドロップ</span>
    <span class="drop-zone-sub">またはここをクリックして選択</span>
    <input type="file" class="hidden" (change)="handleFileSelect($event)" multiple accept="image/*" />
    <span class="drop-zone-limit">１ファイルにつき2MBまで</span>
  </label>

  <!-- タグ変更バー -->
  <div class="tag-edit-bar">
    <input
      class="tag-edit-input"
      maxlength="12"
      [value]="newTagName()"
      (input)="onInputNewTag($event)"
      placeholder="新タグ名"
    />
    <button class="tag-edit-btn" (click)="changeTag()">
      <i class="material-icons">label</i>
      タグを変更
    </button>
  </div>

  <!-- 画像グリッド -->
  <div class="image-grid">
    @for (file of images(); track file) {
      <div
        class="image-cell"
        [class.is-checked]="checkedFiles.has(file.identifier)"
        (click)="imgBlockClick(file.identifier)"
      >
        @if (file.url) {
          <img [src]="file.url | safe: 'resourceUrl'" [alt]="file.name" (click)="onSelectedFile(file)" />
        } @else {
          <div class="cell-loading"><i class="material-icons">hourglass_empty</i></div>
        }
        <div class="cell-check">
          <input type="checkbox" [checked]="checkedFiles.has(file.identifier)" (click)="$event.stopPropagation()" />
        </div>
        <span class="cell-name">{{ file.name }}</span>
      </div>
    }
    @if (images().length === 0) {
      <div class="empty-state">
        <i class="material-icons">collections</i>
        <p>この分類に画像はありません</p>
      </div>
    }
  </div>
</div>
