<!-- draggable-panel class is a marker used by DraggableDirective stack option,
     ui-panel.component.spec.ts と testing/panel-drag-recovery.ts の querySelector の対象。
     見た目用ではなく API マーカーなので Tailwind 化後も保持する。 -->
<div
  class="draggable-panel animate-fly-in rounded-ui-lg border-ui-border-panel bg-ui-panel text-ui-text absolute top-[200px] box-border h-[200px] max-h-full w-[300px] max-w-full overflow-visible border border-solid p-0 shadow-[var(--ui-shadow-md),inset_0_1px_0_rgba(255,255,255,0.06)] [backdrop-filter:blur(24px)_saturate(1.5)] [-webkit-backdrop-filter:blur(24px)_saturate(1.5)]"
  [ngClass]="{ 'pointer-events-none': isPointerDragging }"
  [style.left.px]="left"
  [style.top.px]="top"
  [style.width.px]="width"
  [style.height.px]="height"
  [style.visibility]="panelService.invisible ? 'hidden' : ''"
  [style.pointer-events]="panelService.invisible ? 'none' : ''"
  [resizable.disable]="isMinimized() || isFullScreen()"
  [resizable.minWidth]="minWidth"
  [resizable.minHeight]="minHeight"
  [draggable.stack]="'.draggable-panel'"
  appDraggable
  appResizable
  #draggablePanel
  (mouseenter)="showPortrait(true)"
  (mouseleave)="showPortrait(false)"
>
  <div
    class="rounded-t-ui-lg border-ui-border-titlebar bg-ui-titlebar text-ui-muted relative box-border h-[28px] w-full border-b border-solid px-2 text-[12px] leading-[28px] font-medium tracking-[0.02em] select-none"
    #titleBar
    [style.display]="showTitle() ? '' : 'none'"
  >
    @if (title !== 'メニュー') {
      <div class="absolute top-0 right-0 flex h-[28px] items-center gap-[2px] px-[6px]">
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-[22px] transform-none items-center justify-center border-none bg-transparent px-1 py-[2px] leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          [disabled]="isFullScreen()"
          (click)="toggleMinimize()"
        >
          <i class="material-icons text-[14px]">remove</i>
        </button>
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-[22px] transform-none items-center justify-center border-none bg-transparent px-1 py-[2px] leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          [disabled]="isMinimized()"
          (click)="toggleFullScreen()"
        >
          <i class="material-icons text-[14px]">fullscreen</i>
        </button>
        <button
          class="rounded-ui-sm text-ui-dim hover:bg-ui-hover hover:text-ui-text m-0 inline-flex h-[22px] transform-none items-center justify-center border-none bg-transparent px-1 py-[2px] leading-none shadow-none transition-colors outline-none hover:border-transparent hover:shadow-none"
          (click)="close()"
        >
          <i class="material-icons text-[14px]">close</i>
        </button>
      </div>
    }
    <div class="block truncate pr-[86px]" [appTextTooltip]="panelService.titleTooltip">
      {{ panelService.title }}
    </div>
  </div>
  @if (panelService.chatTab) {
    <chat-portrait-img
      [chatTabidentifier]="panelService.chatTab.identifier"
      [isTilteTop]="true"
      [dispByMouse]="portraitDispByMouse()"
    ></chat-portrait-img>
  }
  @if (panelService.cardStack) {
    <card-stack-list-img [cardStackidentifier]="panelService.cardStack.identifier"></card-stack-list-img>
  }
  <div
    class="rounded-b-ui-lg absolute bottom-0 box-border w-full overflow-auto overscroll-contain"
    [ngStyle]="{
      padding: padding_,
      top: showTitle() ? '28px' : '0',
      overflow: overflowVisible() ? 'visible' : undefined,
    }"
    #scrollablePanel
  >
    <ng-content></ng-content>
    <div #content></div>
  </div>
</div>
