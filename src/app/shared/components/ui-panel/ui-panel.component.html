<div
  class="fly-in"
  [ngClass]="{ 'pointer-events-none': isPointerDragging }"
  class="draggable-panel"
  [style.left.px]="left"
  [style.top.px]="top"
  [style.width.px]="width"
  [style.height.px]="height"
  [style.visibility]="panelService.invisible ? 'hidden' : ''"
  [style.pointer-events]="panelService.invisible ? 'none' : ''"
  [resizable.disable]="isMinimized() || isFullScreen()"
  [draggable.stack]="'.draggable-panel'"
  appDraggable
  appResizable
  #draggablePanel
  (mouseenter)="showPortrait(true)"
  (mouseleave)="showPortrait(false)"
>
  <div class="title" #titleBar [style.display]="showTitle() ? '' : 'none'">
    @if (title !== 'メニュー') {
      <div class="title-button">
        <button [disabled]="isFullScreen()" (click)="toggleMinimize()">
          <i class="material-icons text-[14px]">remove</i>
        </button>
        <button [disabled]="isMinimized()" (click)="toggleFullScreen()">
          <i class="material-icons text-[14px]">fullscreen</i>
        </button>
        <button (click)="close()"><i class="material-icons text-[14px]">close</i></button>
      </div>
    }
    {{ panelService.title }}
  </div>
  @if (panelService.chatTab) {
    <chat-portrait-img
      [chatTabidentifier]="panelService.chatTab.identifier"
      [isTilteTop]="true"
      [dispByMouse]="portraitDispByMouse()"
    ></chat-portrait-img>
  }
  @if (panelService.cardStack) {
    <card-stack-list-img [cardStackidentifier]="panelService.cardStack.identifier"></card-stack-list-img>
  }
  <div
    class="scrollable-panel"
    [ngStyle]="{
      padding: padding_,
      top: showTitle() ? '28px' : '0',
      overflow: overflowVisible() ? 'visible' : undefined,
    }"
    #scrollablePanel
  >
    <ng-content></ng-content>
    <div #content></div>
  </div>
</div>
