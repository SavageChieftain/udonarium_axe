<div class="fs-layout">
  <div class="tag-bar">
    @for (tag of tagList; track tag) {
      <label class="tag-pill">
        <input
          name="image-chg"
          type="radio"
          [value]="tag"
          [ngModel]="selectTag()"
          (ngModelChange)="selectTag.set($event)"
          (change)="resetBtn()"
        />
        <span>{{ tag.length === 0 ? '未設定' : tag }}</span>
      </label>
    }
  </div>
  <div class="image-grid">
    @if (isAllowedEmpty) {
      <button class="image-cell empty-cell" (click)="onSelectedFile(empty)">
        <i class="material-icons">hide_image</i>
        <span class="cell-name">画像なし</span>
      </button>
    }
    @for (file of images(); track file.identifier) {
      <button class="image-cell" (click)="onSelectedFile(file)">
        @if (file.url) {
          <img [src]="file.url | safe: 'resourceUrl'" [alt]="file.name" />
        } @else {
          <div class="cell-loading"><i class="material-icons">hourglass_empty</i></div>
        }
        <span class="cell-name">{{ file.name }}</span>
      </button>
    }
    @if (images().length === 0 && !isAllowedEmpty) {
      <div class="empty-state">
        <i class="material-icons">collections</i>
        <p>この分類に画像はありません</p>
      </div>
    }
  </div>
</div>
