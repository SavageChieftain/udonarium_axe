<div class="swatch-container">
  <div class="swatches">
    @for (color of presets; track color) {
      <button
        type="button"
        class="swatch"
        [class.selected]="color.toLowerCase() === value.toLowerCase()"
        [style.background-color]="color"
        [disabled]="disabled"
        (click)="selectPreset(color)"
      ></button>
    }
    <button
      type="button"
      class="swatch swatch-custom"
      [class.selected]="isCustomColor || showPicker()"
      [style.background-color]="isCustomColor ? value : ''"
      [disabled]="disabled"
      (click)="togglePicker()"
      title="その他の色..."
    >
      @if (!isCustomColor) {
        <span class="custom-icon">…</span>
      }
    </button>
  </div>
  @if (showPicker()) {
    <div class="picker-container">
      <color-picker
        [value]="value"
        [hideAlpha]="true"
        format="hex"
        [disabled]="disabled"
        (valueChange)="onPickerChange($event)"
      ></color-picker>
    </div>
  }
</div>
