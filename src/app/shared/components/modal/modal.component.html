<div class="absolute inset-0 z-1899999 flex items-center justify-center overscroll-contain">
  <div
    class="animate-bg-fade-in text-ui-text absolute inset-0 z-[-1] bg-[rgba(0,0,0,0.3)]"
    (click)="clickBackground($event)"
  ></div>
  <div
    class="animate-fly-in border-ui-border-panel bg-ui-panel text-ui-text box-border h-auto max-h-[calc(100%-10px)] w-[800px] max-w-full overflow-hidden border border-solid"
  >
    <div
      class="bg-ui-elevated text-ui-text relative box-border h-[25px] w-full overflow-hidden px-[5px] py-[2px] text-[12px] whitespace-nowrap"
    >
      <div class="absolute top-0 right-0">
        <button
          class="text-ui-text hover:text-ui-text rounded-none border-none bg-transparent outline-none hover:bg-transparent"
          (click)="resolve()"
        >
          <i class="material-icons text-[14px]">close</i>
        </button>
      </div>
      <span class="block truncate pr-[30px]" [appTextTooltip]="titleTooltip">{{ title }}</span>
    </div>
    <div class="box-border max-h-[calc(100vh-41px)] w-full overflow-auto p-2">
      <ng-content></ng-content>
      <div #content></div>
    </div>
  </div>
</div>
