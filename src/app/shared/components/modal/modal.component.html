<div class="component">
  <div class="modal-background bg-fade-in" (click)="clickBackground($event)"></div>
  <div class="modal-panel fly-in">
    <div class="title">
      <div class="title-button">
        <button (click)="resolve()"><i class="material-icons text-[14px]">close</i></button>
      </div>
      {{ title }}
    </div>
    <div class="scrollable-panel">
      <ng-content></ng-content>
      <div #content></div>
    </div>
  </div>
</div>
