version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # 22.1.5 以降の @angular/build は unit-test ビルダーが setupFiles を適用しなくなり、
      # happy-dom に無い WebRTC を補うスタブが走らないまま @skyway-sdk/core を読み込んで
      # 全 spec が落ちる。22.1.4 に固定しているので、上がってくる提案も止める。
      - dependency-name: '@angular/build'
      - dependency-name: '@angular/cli'
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-*'
          - 'ng-*'
          - '@ng-*'
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '09:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
