name: Deploy

# 環境ごと (staging / production) に S3 同期 + CloudFront invalidation を行う
# reusable workflow。release.yml から workflow_call で呼び出される。
#
# `environment` input が GitHub Environments の名前と対応していて、
# Secrets はその環境からのみ解決される。各環境に下記 5 つの Secret を登録する:
#   - AWS_REGION
#   - AWS_S3_BUCKET
#   - AWS_DEPLOY_ROLE_ARN
#   - CLOUDFRONT_DISTRIBUTION_ID
#   - BACKEND_URL

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment name (staging | production)'
        required: true
        type: string
      ref:
        description: 'デプロイ対象の Git ref (タグ推奨: v1.2.3)'
        required: true
        type: string

permissions: {}

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject backend URL
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is not configured for environment '${{ inputs.environment }}'"
            exit 1
          fi
          mkdir -p dist/assets
          jq --arg url "$BACKEND_URL" '.backend.url = $url' \
            src/assets/config.json.example > dist/assets/config.json
          test -s dist/assets/config.json

      - name: Configure AWS credentials (OIDC AssumeRole)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: udonarium-axe-${{ inputs.environment }}-${{ github.run_id }}

      - name: Sync dist/ to S3
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          # axe_*.zip は GitHub Release 用なので S3 には載せない
          aws s3 sync dist/ "s3://$BUCKET/" \
            --delete \
            --exclude "axe_*.zip" \
            --cache-control "public, max-age=31536000, immutable"

          # ハッシュが付かないファイルは即時反映させたいので revalidate
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dist/assets/config.json "s3://$BUCKET/assets/config.json" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
