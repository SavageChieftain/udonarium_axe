name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # AWS OIDC AssumeRole 用

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx ng test

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BEFORE_SHA=$(git rev-parse HEAD)
          npx semantic-release
          AFTER_SHA=$(git rev-parse HEAD)
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "::notice::semantic-release published v$VERSION"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release published; skipping deploy"
          fi

      # ----- ここから先は新リリースが作られた場合のみ -----

      - name: Inject production backend URL
        if: steps.semantic.outputs.released == 'true'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::BACKEND_URL secret is not configured"
            exit 1
          fi
          mkdir -p dist/assets
          jq --arg url "$BACKEND_URL" '.backend.url = $url' \
            src/assets/config.json.example > dist/assets/config.json
          test -s dist/assets/config.json

      - name: Configure AWS credentials (OIDC AssumeRole)
        if: steps.semantic.outputs.released == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: udonarium-axe-deploy-${{ github.run_id }}

      - name: Sync dist/ to S3
        if: steps.semantic.outputs.released == 'true'
        run: |
          # axe_*.zip は GitHub Release 用なので S3 には載せない
          aws s3 sync dist/ "s3://${{ vars.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "axe_*.zip" \
            --cache-control "public, max-age=31536000, immutable"

          # ハッシュが付かないファイルはキャッシュさせない
          aws s3 cp dist/index.html "s3://${{ vars.AWS_S3_BUCKET }}/index.html" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp dist/assets/config.json "s3://${{ vars.AWS_S3_BUCKET }}/assets/config.json" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "application/json"

      - name: Invalidate CloudFront
        if: steps.semantic.outputs.released == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
